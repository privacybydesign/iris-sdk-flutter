name: iris_sdk_flutter
description: Flutter bindings for the Iris SDK (passportreader.app) — vendor-owned face verification that drives its own native camera UI.

version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: foundation.privacybydesign.irissdkflutter
        pluginClass: IrisSdkFlutterPlugin
      ios:
        pluginClass: IrisSdkFlutterPlugin
