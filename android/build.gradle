plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "foundation.privacybydesign.irissdkflutter"
version = "1.0"

android {
    namespace = "foundation.privacybydesign.irissdkflutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // The Iris SDK's own manifest requires API 26+.
        minSdk = 26
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }
}

// The vendor SDK is committed to this repository as android/libs/PassportReader.aar.
//
// flatDir rather than `implementation files(...)`: the latter treats an .aar as
// a bare jar, so the SDK's manifest, resources and JNI libs would never merge
// into the consuming app.
//
// The repository has to be injected into rootProject.allprojects, not declared
// as a plain `repositories {}` block here. Gradle resolves a configuration
// using the repositories of the project that owns it, so :app resolving its own
// runtimeClasspath never consults this module's repositories — a local block
// fails with "Could not find :PassportReader:". Injecting into allprojects puts
// it on :app too, which is what makes the package self-contained rather than
// requiring every consuming app to wire up a flatDir itself. (Same approach
// flutter_face_api uses to add Regula's maven repo.)
def vendorLibs = file("libs")
rootProject.allprojects {
    repositories {
        flatDir {
            dirs vendorLibs
        }
    }
}

dependencies {
    implementation(group: "", name: "PassportReader", ext: "aar")
}
